########### paramter (ref to tulip_cedarx.conf)############
[parameter]

rtsp_net_type = 3                      #RTSP Network type, 0: "lo", 1: "eth0", 2: "br0", 3: "wlan0"
ve_rec_ref_buf_reduce_enable = 0       #0:disable buf reduce, 1:enable buf reduce
aiisp_npu_ref_buf_reduce_enable = 0    #0:disable aiisp npu ref buf reduce, 1:enable aiisp npu ref buf reduce
aiisp_switch_release_res_enable = 0    #0:no release aiisp resources when aiisp switch, 1:release aiisp resources when aiisp switch
stream_buf_size = 0                    #0:default 1/10*yuv420, unit:bytes
product_mode = 0                       #0:static ipc, 1:moving ipc, 2: doorbell, 3:cdr, 4:sdv, 5:projection, 6:UAV(Unmanned Aerial Vehicle)
vbr_opt_en = 0                         #0: old vbr bitrate control, 1:new vbr bitrate control
rc_mode = 1                            #for H264/H265, 0:CBR  1:VBR  2:FIXQP(only for debug)
init_qp = 37
min_i_qp = 25
max_i_qp = 45
min_p_qp = 25
max_p_qp = 45
moving_th = 20
mb_qp_limit_en = 1
quality = 1
p_bits_coef = 10
i_bits_coef = 10
isp_ve_linkage_enable = 1
camera_adaptive_moving_and_static_enable = 1
