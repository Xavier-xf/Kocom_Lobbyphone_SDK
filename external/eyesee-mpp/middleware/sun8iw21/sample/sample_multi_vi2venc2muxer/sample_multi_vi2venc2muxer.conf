########### paramter (ref to tulip_cedarx.conf)############
[parameter]
####dev_node, the video data where to get data from. =0, /dev/video0;  =1, /dev/video1; -1, disable####
vipp0 = 0
vipp0_format = lbc2.5
vipp0_capture_width = 1920
vipp0_capture_height = 1080
vipp0_framerate = 20
vipp0_buf_num = 4
vipp1 = 4
vipp1_format = nv21
vipp1_capture_width = 640
vipp1_capture_height = 360
vipp1_framerate = 20
vipp1_buf_num = 4

#params of every video encode line
videoA_vipp = 0 #vipp to connect, -1 means disable.
videoA_file = "/mnt/extsd/1080p.mp4"
videoA_file_cnt = 3 #when loop record, keep file_cnt files. 0 means dont delete files.
videoA_framerate = 20
videoA_bitrate = 2000000
videoA_width = 1920
videoA_height = 1080
videoA_encoder = "H.264"
videoA_rc_mode = 1 ###rc_mode for H264/H265 0:CBR  1:VBR  2:FIXQP  3:QPMAP
videoA_key_frame_interval = 0
videoA_ve_rec_ref_buf_reduce_enable = 0
videoA_link_isp2ve = 1
videoA_link_ve2isp = 0
videoA_duration = 30 #####per output media file time len (s)
videoA_timelapse = -1 # -1:disable timelapse; 0:enable slow photograph; >0:enable timelapse, interval unit is us

