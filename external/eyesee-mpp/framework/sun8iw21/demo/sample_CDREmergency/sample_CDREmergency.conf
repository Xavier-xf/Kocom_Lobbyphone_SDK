########### paramter (ref to tulip_cedarx.conf)############
[parameter]
capture_width = 1920
capture_height = 1080
# pic_format is yu12, yv12, nv21, nv12
pic_format = nv21
frame_rate = 20
display_width = 640
display_height = 360
#encode_type is h264, h265, mjpeg
encode_type = h264
# audio encode type : aac, mp3.  means no audio.
audio_encode_type = aac
encode_width = 1920
encode_height = 1080
encode_bitrate = 8    # Mbit
encode_frame_rate = 20

folder = "/mnt/extsd/sample_CDREmergency_Files"
count = 5
# file method: by time or by size
method = time   #time or size.
duration = 60	#unit:s
size = 100 #unit: MByte

mux_cache_duration = 5000  # ms
first_emergency_time = 15 #s
second_emergency_time = 50 #s
impact_duration = 15 #unit:s
#impact file generation style: add_file or switch_file.
# add_file: add a new muxChn to generate impact file
# switch_file: use current muxChn, switch to impact file, then switch back to normal file.
impact_style = "switch_file"

