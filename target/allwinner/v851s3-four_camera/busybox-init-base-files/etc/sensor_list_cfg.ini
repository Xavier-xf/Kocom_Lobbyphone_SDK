#R311 sensor list configs
#
##################bus config######################
#
#used:                 0: not used,    1: used;
#csi_sel:                      0: mipi,            1:  parallel ;
#device_sel:           0: dev0,            1: dev1;
#sensor_twi_id:twi id, for example: sensor_twi_id = 0
#
##################power configs###################
#power_settings_enable: 0: enable the power settings in  sysconfig.fex;  1: enable the power settings in this file.
#
#iovdd                    The name of iovdd for this camera;
#iovdd_vol                The voltage value of iovdd in uV;
#
###############detect sensor configs##############
#
#detect_sensor_num:              The number of sensors need be detected in this bus.
#sensor_name[x]:          The sensor name in sensor driver.
#sensor_twi_addr[x]:      The i2c address of this sensor.
#sensor_type[x]:          The sensor type, 0: YUV, 1: RAW;
#sensor_stby_mode[x]:            Not used;
#sensor_hflip[x]          Horizontal flip;
#sensor_vflip[x]          Vertical  flip;
#act_name[x]              The VCM name in vcm driver, only RAW sensor need be configured;
#act_twi_addr[x]          The i2c address of this VCM;
#
##################################################
[front_camera_cfg]

#bus configs
used                    = 1
csi_sel                 = 1
device_sel              = 1
sensor_twi_id           = 1

#power configs
power_settings_enable   = 0
cameravdd               = "reg_aldo3"
cameravdd_vol           = 1800000
iovdd                   = "reg_aldo3"
iovdd_vol               = 1800000
avdd                    = "reg_aldo2"
avdd_vol                = 2800000
dvdd                    = "reg_bldo4"
dvdd_vol                = 1500000
afvdd                   = ""
afvdd_vol               =

#detect sensor configs
detect_sensor_num       = 4

sensor_name0            = "f37p_mipi"
sensor_twi_addr0        = 0x80
sensor_type0            = 1
sensor_isp_used0        = 1
sensor_stby_mode0       = 0
sensor_hflip0           = 0
sensor_vflip0           = 0
act_name0               =
act_twi_addr0           =

sensor_name1            = "gc2083_mipi"
sensor_twi_addr1        = 0x6e
sensor_type1            = 1
sensor_isp_used1        = 1
sensor_stby_mode1       = 0
sensor_hflip1           = 0
sensor_vflip1           = 0
act_name1               =
act_twi_addr1           =

sensor_name2            = "mis2008_mipi"
sensor_twi_addr2        = 0x60
sensor_type2            = 1
sensor_isp_used2        = 1
sensor_stby_mode2       = 0
sensor_hflip2           = 0
sensor_vflip2           = 0
act_name2               =
act_twi_addr2           =

sensor_name3           = "gc1084_mipi"
sensor_twi_addr3        = 0x6e
sensor_type3            = 1
sensor_stby_mode3       = 0
sensor_hflip3           = 0
sensor_vflip3           = 0
act_name3               =
act_twi_addr3           =
